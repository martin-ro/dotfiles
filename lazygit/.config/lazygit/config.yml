gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
customCommands:
  - key: "<c-a>"
    context: "files"
    description: "Discuss file with a herdr agent"
    prompts:
      - type: "menuFromCommand"
        title: "Agent pane"
        key: "Pane"
        command: "to-agent panes"
        filter: '^(?P<id>\S+)\t(?P<label>.+)$'
        valueFormat: "{{ .id }}"
        labelFormat: "{{ .label }}"
      - type: "input"
        title: "Note (optional)"
        key: "Note"
    command: "to-agent send {{.Form.Pane}} {{.SelectedPath | quote}} {{.Form.Note | quote}}"
    output: "log"
  - key: "e"
    context: "files"
    description: "Open file in my running Neovim (herdr tab)"
    command: '$HOME/.local/bin/open-in-nvim {{.SelectedPath | quote}}'
    output: log
