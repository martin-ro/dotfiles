add_newline = true
command_timeout = 200
format = "$hostname[${custom.repo}$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

# The machine's name on every machine (Herdr's terminals there aren't ssh sessions).
[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold purple"
aliases = { "mmbp" = "mac" }

# The repo's name, also in a worktree (Herdr names those after the long branch).
[custom.repo]
command = 'd=$(git rev-parse --path-format=absolute --git-common-dir); d=${d%/.git}; echo "${d##*/}"'
when = true
require_repo = true
format = "[$output]($style)"
style = "bold cyan"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan" # Keep: it turns on repo_root_format.
repo_root_format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"
truncation_length = 15

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
